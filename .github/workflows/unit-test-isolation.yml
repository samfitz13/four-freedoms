name: Unit test isolation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    name: Unit worker isolation regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify parallel process and environment isolation
        run: pnpm test:isolation
      - name: Verify auth, CSV security and redacted logging
        run: pnpm test:unit lib/auth-security.test.ts lib/financial/csv-parser.test.ts lib/logger.test.ts
      - name: Verify lint enforcement after dependency pruning
        run: pnpm test:unit scripts/dependency-safety.test.mjs
