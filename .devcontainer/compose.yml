services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: sleep infinity
    network_mode: service:postgres
    volumes:
      - ..:/workspaces/four-freedoms:cached
      - dependencies:/workspaces/four-freedoms/node_modules
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: freedom
      POSTGRES_PASSWORD: freedom
      POSTGRES_DB: freedom_four
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freedom -d freedom_four"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  dependencies:
  database:
