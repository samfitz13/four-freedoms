# Local dev Postgres for freedom-four.
# Starts with `pnpm db:up`, stops with `pnpm db:down`.
#
# This matches PlanetScale Postgres syntax (pg 17). Against PlanetScale
# you'd just swap DATABASE_URL in .env.local; schema + queries are portable.

services:
  postgres:
    image: postgres:17-alpine
    container_name: freedom-four-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: freedom
      POSTGRES_PASSWORD: freedom
      POSTGRES_DB: freedom_four
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freedom -d freedom_four"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
